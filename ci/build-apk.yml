name: Build and Release Antigravity APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/ExamPulse-Antigravity-v2.0.0-debug.apk
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPulse-Antigravity-v2.0.0-APK
          path: release-artifacts/*.apk

      - name: Create or Update GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-antigravity
          name: "ExamPulse Antigravity v2.0.0 (CUJammu & Engineering)"
          body: |
            # 🚀 ExamPulse // Antigravity v2.0.0

            ### 📥 Download Android APK
            Click the attached **`ExamPulse-Antigravity-v2.0.0-debug.apk`** below to install directly on your Android phone or emulator.

            ---

            ### 🌌 Upgraded Powerhouse Features
            - **CUJammu B.Tech CSE Cyber Security (Sem 1-8)** curriculum, past 5-10 years PYQ topic frequency, and radar weightage breakdown.
            - **60-70% Exam Probability Heatmap** with confidence scores (`97% Highest Yield`, `94% Frequent`).
            - **Official Sectioned Exam Simulator** (Section A: 2M Compulsory, Section B: 5M Conceptual, Section C: 10M Architectural with internal choices).
            - **Active Recall Engine** with SuperMemo-2 (SM-2) spaced repetition algorithm & 3D card flip physics.
            - **Live Timed Mock Exam HUD** with floating timer, bookmark drawer, and **Instant Gemini AI Answer Grading** (10-point rubric breakdown, missed keywords, and benchmark answers).
            - **Smart Viva & Rapid-Fire Quiz Mode** for laboratory oral exams.
            - **Clean Printable Standard View** for offline study and batch sharing.
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
