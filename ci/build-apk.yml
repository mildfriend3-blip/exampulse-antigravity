name: Build and Release Antigravity APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_public_release:
        description: 'Publish public release downloadable by anyone without login'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Android APK (Publicly Downloadable)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Built APK
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} release-artifacts/ExamPulse-Antigravity-v2.0.0.apk \;
          ls -la release-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPulse-Antigravity-v2.0.0-APK
          path: release-artifacts/ExamPulse-Antigravity-v2.0.0.apk
          retention-days: 90
          overwrite: true

      - name: Publish Public Release (Anonymous 1-Click Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-antigravity
          name: "ExamPulse Antigravity v2.0.0 (Public Downloadable APK)"
          body: |
            # 🚀 ExamPulse // Antigravity v2.0.0 (Public Release)

            ### 📥 Download Android APK (No Sign-in Required)
            Anyone can download and install the pre-compiled APK directly from the assets below:

            - 👉 **[ExamPulse-Antigravity-v2.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v2.0.0-antigravity/ExamPulse-Antigravity-v2.0.0.apk)**

            ---

            ### ⚡ Continuous Anonymous Download (nightly.link)
            Download continuous build artifacts anonymously without a GitHub account:
            - **Direct Link:** [nightly.link/mildfriend3-blip/exampulse-antigravity/workflows/build-apk/main/ExamPulse-Antigravity-v2.0.0-APK.zip](https://nightly.link/${{ github.repository }}/workflows/build-apk/main/ExamPulse-Antigravity-v2.0.0-APK.zip)

            ---

            ### 🌌 Key Engineering Intelligence Features
            - **CUJammu B.Tech CSE Cyber Security (Sem 1-8)** curriculum & PYQ frequency radar.
            - **60-70% Exam Probability Heatmap** with confidence scores.
            - **Section A (2M), Section B (5M), Section C (10M with OR choices)** university simulator.
            - **Active Recall Engine** with SuperMemo-2 (SM-2) spaced repetition & 3D card flips.
            - **Live Timed Mock Exam HUD** with **Instant Gemini AI Answer Grading** (rubric score out of 10, keywords check, benchmark model answer).
            - **One-Tap Rapid-Fire Viva Prep** with examiner follow-up traps.
            - **Clean Printable Standard View** for offline study.
          files: release-artifacts/ExamPulse-Antigravity-v2.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Public Download Summary
        run: |
          echo "## 🚀 ExamPulse Antigravity APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Public Download Links (Downloadable by Anyone):" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Direct Release APK:** [ExamPulse-Antigravity-v2.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v2.0.0-antigravity/ExamPulse-Antigravity-v2.0.0.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Direct Anonymous Zip (nightly.link):** [Download APK Zip](https://nightly.link/${{ github.repository }}/workflows/build-apk/main/ExamPulse-Antigravity-v2.0.0-APK.zip)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install on any Android device with *'Install Unknown Apps'* enabled." >> $GITHUB_STEP_SUMMARY
