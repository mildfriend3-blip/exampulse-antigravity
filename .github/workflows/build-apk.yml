name: Build and Release Antigravity APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_public_release:
        description: 'Publish public release downloadable by anyone without login'
        required: true
        type: boolean
        default: true
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
jobs:
  build:
    name: Build Android APK (Publicly Downloadable)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Generate Gradle Wrapper
